
<!DOCTYPE html>
<html>
    <head>
        <title>Movie Quiz</title>
        <script src="quiz.js" defer></script>
    </head>

    <body>

        <h1>Movie Quiz</h1>

        <form onsubmit="checkAnswers(); return false;">

            <!--Question 1 Radio Buttons-->
            <p>1. Who is Spider-Man's secret identity?</p>

            <input type="radio" id="peter" name="question1" value="Peter Parker">
            <label for="peter">Peter Parker</label><br>

            <input type="radio" id="bruce" name="question1" value="Bruce Wayne">
            <label for="bruce">Bruce Wayne</label><br>

            <input type="radio" id="clark" name="question1" value="Clark Kent">
            <label for="clark">Clark Kent</label><br>
            <p id="result1"></p><br>


            <!--Question 2 Radio Buttons-->
            <p>2. Which movie series features Dominic Toretto?</p>

            <input type="radio" id="fast" name="question2" value="Fast and Furious">
            <label for="fast">Fast and Furious</label><br>

            <input type="radio" id="batman" name="question2" value="Batman">
            <label for="batman">Batman</label><br>

            <input type="radio" id="avengers" name="question2" value="Avengers">
            <label for="avengers">Avengers</label><br>
            <p id="result2"></p><br>


            <!--Question 3 Checkboxes-->
            <p>3. Which of these are superhero movies? Select all that apply.</p>

            <input type="checkbox" id="spiderman" name="question3" value="Spider-Man">
            <label for="spiderman">Spider-Man</label><br>

            <input type="checkbox" id="batman2" name="question3" value="Batman">
            <label for="batman2">Batman</label><br>

            <input type="checkbox" id="superman" name="question3" value="Superman">
            <label for="superman">Superman</label><br>

            <input type="checkbox" id="cars" name="question3" value="Cars">
            <label for="cars">Cars</label><br>
            <p id="result3"></p><br>


            <!--Question 4 Checkboxes-->
            <p>4. Which of these are movie franchises? Select all that apply.</p>

            <input type="checkbox" id="marvel" name="question4" value="Marvel">
            <label for="marvel">Marvel</label><br>

            <input type="checkbox" id="starwars" name="question4" value="Star Wars">
            <label for="starwars">Star Wars</label><br>

            <input type="checkbox" id="fast2" name="question4" value="Fast and Furious">
            <label for="fast2">Fast and Furious</label><br>

            <input type="checkbox" id="spotify" name="question4" value="Spotify">
            <label for="spotify">Spotify</label><br>
            <p id="result4"></p><br>


            <input type="submit" value="Submit Quiz">

        </form>

        <h2 id="score"></h2>

    </body>
</html>
